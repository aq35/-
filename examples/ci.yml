# GitHub Actions のサンプル（.github/workflows/ci.yml に置く）
#
# トリガーと環境の対応:
#   main への push        → dev
#   release/** への push  → staging
#   タグ v* の push       → prod
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # schema リポジトリが private の場合、読み取り権限のあるトークンを渡す
          token: ${{ secrets.SCHEMA_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # 生成コードをコミットする方式（方針 B）の場合は、再生成して差分が無いことを検査:
      # - run: cargo run -p codegen && git diff --exit-code

  schema-pin:
    # サブモジュールが schema リポジトリの main にマージ済みのコミットを指しているか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SCHEMA_REPO_TOKEN || github.token }}
      - name: Check schema commit is on schema/main
        run: |
          git -C schema fetch origin main
          if ! git -C schema merge-base --is-ancestor HEAD origin/main; then
            echo "::error::schema/ が schema リポジトリの main に無いコミットを指しています。先に schema 側の PR をマージしてください。"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    needs: [test, schema-pin]
    runs-on: ubuntu-latest
    steps:
      - name: Select environment
        id: env
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)          echo "name=prod"    >> "$GITHUB_OUTPUT" ;;
            refs/heads/release/*)  echo "name=staging" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main)       echo "name=dev"     >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Deploy
        run: echo "deploy ${{ github.sha }} to ${{ steps.env.outputs.name }}"  # 実際のデプロイ処理に置き換える
